<!DOCTYPE html>
<html>
<head>
  <title>Google Meet Auto Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      width: 300px;
      padding: 18px 10px 14px 10px;
      font-family: 'Inter', Arial, sans-serif;
      background: #18191a;
      color: #e0e0e0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Poppins', 'Inter', Arial, sans-serif;
      font-size: 17px;
      margin-bottom: 10px;
      color: #f5f7fa;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .divider {
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, #a259f7 0%, #6a82fb 100%);
      border: none;
      border-radius: 2px;
      margin: 0 0 22px 0;
      opacity: 0.7;
      box-shadow: 0 1px 4px rgba(162,89,247,0.10);
    }
    .popup-setting-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(32,32,32,0.85);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      padding: 18px 18px 18px 18px;
      margin-bottom: 18px;
      width: 100%;
      max-width: 270px;
      position: relative;
    }
    .setting-label {
      font-size: 15px;
      font-weight: 500;
      color: #f0f0f0;
      margin-right: 18px;
      letter-spacing: 0.01em;
      flex: 1;
      text-align: left;
      font-family: 'Inter', Arial, sans-serif;
    }
    .custom-switch-label {
      display: flex;
      align-items: center;
      position: relative;
      cursor: pointer;
      user-select: none;
      margin: 0;
    }
    .custom-switch {
      position: relative;
      width: 36px;
      height: 20px;
      margin-right: 0;
    }
    .custom-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .custom-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #bbb;
      border-radius: 20px;
      transition: background 0.2s;
    }
    .custom-switch input:checked + .custom-slider {
      background: linear-gradient(90deg, #a259f7 0%, #6a82fb 100%);
    }
    .custom-slider:before {
      position: absolute;
      content: '';
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.10);
    }
    .custom-switch input:checked + .custom-slider:before {
      transform: translateX(16px);
    }
    .custom-switch-label .custom-tooltip {
      visibility: hidden;
      opacity: 0;
      width: 220px;
      background: #222;
      color: #fff;
      text-align: left;
      border-radius: 6px;
      padding: 6px 10px;
      position: absolute;
      z-index: 1001;
      left: 50%;
      bottom: 110%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 400;
      pointer-events: none;
      transition: opacity 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .custom-switch-label .custom-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px;
      border-style: solid;
      border-color: #222 transparent transparent transparent;
    }
    .custom-switch-label:hover .custom-tooltip {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Google Meet Auto Settings</h1>
  <div class="divider"></div>
  <div class="popup-setting-card">
    <span class="setting-label">Auto disable mic</span>
    <label class="custom-switch-label">
      <span class="custom-switch">
        <input type="checkbox" id="mic-enabled">
        <span class="custom-slider"></span>
      </span>
      <span class="custom-tooltip">If enabled, your mic will be off by default when you join.</span>
    </label>
  </div>
  <div class="popup-setting-card">
    <span class="setting-label">Auto disable camera</span>
    <label class="custom-switch-label">
      <span class="custom-switch">
        <input type="checkbox" id="camera-enabled">
        <span class="custom-slider"></span>
      </span>
      <span class="custom-tooltip">If enabled, your camera will be off by default when you join.</span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
